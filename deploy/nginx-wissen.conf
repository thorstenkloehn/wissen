# nginx als Reverse-Proxy vor der Web-App. Kopieren nach /etc/nginx/sites-available/wissen,
# Domain eintragen, dann:
#   sudo ln -s /etc/nginx/sites-available/wissen /etc/nginx/sites-enabled/wissen
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d IHRE-DOMAIN.de
# certbot holt das HTTPS-Zertifikat und trägt den Block für Port 443 selbst hier ein.
# Die Domain muss per DNS auf den Server zeigen; die Ports 80 und 443 müssen offen sein.
server {
    listen 80;
    listen [::]:80;
    server_name IHRE-DOMAIN.de;

    # Keine nginx-Version in Fehlerseiten und im Header "Server".
    server_tokens off;

    # Eine Seite darf 200 000 Zeichen Markdown haben; als Formular gesendet
    # ist das mehr als die Voreinstellung von 1 MB.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Die App beantwortet nur Anfragen an die Domain aus AllowedHosts.
        proxy_set_header Host $host;
        # Adresse des Besuchers, für die Begrenzung der Anmeldeversuche.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Damit die App weiß, dass der Besucher per HTTPS kommt.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
